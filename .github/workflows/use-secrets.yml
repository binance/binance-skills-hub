name: Use Repository Secrets Example

# Add secrets before running this workflow:
# Repository Settings > Secrets and variables > Actions > New repository secret
# Create BINANCE_API_KEY and BINANCE_SECRET_KEY there.
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  use-secrets-safely:
    name: Consume secrets without exposing values
    runs-on: ubuntu-latest
    # Secrets are mapped into environment variables at the job level.
    # They can also be scoped to individual steps if needed.
    env:
      BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
      BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Demonstrate safe secret consumption in a script
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import hashlib
          import hmac
          import os

          api_key = os.environ["BINANCE_API_KEY"]
          secret_key = os.environ["BINANCE_SECRET_KEY"]

          payload = b"symbol=BTCUSDT&timestamp=1700000000000"
          signature = hmac.new(secret_key.encode(), payload, hashlib.sha256).hexdigest()
          headers = {"X-MBX-APIKEY": api_key, "X-MBX-SIGNATURE": signature}

          assert headers["X-MBX-APIKEY"]
          assert headers["X-MBX-SIGNATURE"]
          print("Secrets were loaded and used by the script without printing their values.")
          PYEOF
