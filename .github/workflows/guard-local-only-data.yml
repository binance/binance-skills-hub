name: Guard local-only data
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  guard-local-only-data:
    name: Block local-only data files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Reject tracked local-only data files
        run: node scripts/check-no-tracked-data.mjs
      - name: Test local-only data filename fixtures
        run: node scripts/test-guard-local-only-data.mjs
